# Build MCUboot as a first-stage bootloader so the application can be updated
# over the SMP-over-Bluetooth transport already configured in prj.conf.
#
# Everything else is left at the NCS defaults for SOC_SERIES_NRF54L:
#   - mode         : swap-using-move (test-then-confirm, automatic revert)
#   - signature    : ED25519, image hash SHA512
#   - signing key  : MCUboot's stock bootloader/mcuboot/root-ed25519.pem
#                    (a publicly known development key — see README)
#   - partitions   : from devicetree; Kconfig.sysbuild sets PARTITION_MANAGER=n
#   - max sectors  : BOOT_MAX_IMG_SECTORS_AUTO defaults y without Partition
#                    Manager, which matters here (712K / 4K = 178 sectors, well
#                    over the static default of 128).
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Produce a single merged_<board>.hex containing MCUboot + the signed
# application, so a factory/first-time flash is one artifact over J-Link.
SB_CONFIG_MERGED_HEX_FILES=y
