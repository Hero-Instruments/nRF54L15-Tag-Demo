# MCUboot image configuration for the nRF54L15 Tag.
#
# Keeps the bootloader inside the 62K boot_partition. Modelled on the two
# in-SDK references for this SoC:
#   nrf/samples/dfu/smp_svr/sysbuild/mcuboot/boards/nrf54l15dk_nrf54l15_cpuapp.conf
#   nrf/applications/matter_weather_station/sysbuild/mcuboot/boards/nrf54l15tag_nrf54l15_cpuapp.conf

# Both image slots live in internal RRAM. The flash (RRAM) driver has to be
# enabled explicitly — MCUboot y-selects FLASH_MAP, which needs a driver — but
# external-flash support is not needed.
CONFIG_FLASH=y
CONFIG_SPI=n
CONFIG_SPI_NOR=n
CONFIG_BOOT_WATCHDOG_FEED=n

# ED25519 + SHA512 verification needs a large stack, or MCUboot MPU-faults.
CONFIG_MAIN_STACK_SIZE=16384

# Footprint: minimal libc and nano printf instead of picolibc/full cbprintf.
CONFIG_MINIMAL_LIBC=y
CONFIG_CBPRINTF_NANO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# Without a tickless kernel the SYSCOUNTER value is not restored correctly after
# a software reset, so each successive reboot takes longer than the last.
CONFIG_TICKLESS_KERNEL=y

CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MCUboot"
